<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GlobalCall</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#0b1424;color:#fff;
 font-family:Arial,sans-serif;min-height:100vh;
 display:flex;justify-content:center;padding:20px;
}
.app{
 width:100%;max-width:420px;background:#121e32;
 border-radius:24px;padding:24px;
 border:1px solid #26344c;
}
.brand{font-size:28px;font-weight:bold;color:#00b8ff}
.subtitle{color:#94a3b8;margin-top:6px}
.balance{
 margin:24px 0;padding:18px;background:#1b2b40;
 border-radius:16px;display:flex;
 justify-content:space-between;align-items:center;
}
.balance strong{font-size:22px;color:#00c853}
button{cursor:pointer}
.recharge{
 background:#00b8ff;color:#07111e;border:0;
 border-radius:10px;padding:12px 15px;font-weight:bold;
}
input{
 width:100%;background:#0b1424;color:#fff;
 border:1px solid #334155;border-radius:14px;
 padding:18px;font-size:23px;text-align:center;
 margin:15px 0;outline:none;
}
.pad{
 display:grid;grid-template-columns:repeat(3,1fr);
 gap:12px;margin-top:15px;
}
.key{
 height:65px;border-radius:16px;border:1px solid #334155;
 background:#1b2b40;color:white;font-size:25px;
}
.key:active{background:#00b8ff;color:#000}
.actions{display:flex;gap:15px;margin-top:24px}
.call,.end{
 flex:1;border:0;padding:17px;border-radius:14px;
 font-size:18px;font-weight:bold;color:white;
}
.call{background:#00c853}
.end{background:#ef4444}
.status{
 text-align:center;margin-top:20px;color:#94a3b8;
 min-height:24px;
}
.footer{
 margin-top:25px;text-align:center;color:#64748b;
 font-size:12px;
}
</style>
</head>
<body>
<div class="app">
 <div class="brand">🌐 GlobalCall</div>
 <div class="subtitle">International Calling</div>

 <div class="balance">
  <div>
   <small>Demo Balance</small>
   <br><strong>$0.00</strong>
  </div>
  <button class="recharge" onclick="recharge()">Recharge</button>
 </div>

 <input id="phone" type="tel" placeholder="+1 234 567 8900"
 autocomplete="tel" aria-label="Phone number">

 <div class="pad">
  <button class="key" onclick="add('1')">1</button>
  <button class="key" onclick="add('2')">2</button>
  <button class="key" onclick="add('3')">3</button>
  <button class="key" onclick="add('4')">4</button>
  <button class="key" onclick="add('5')">5</button>
  <button class="key" onclick="add('6')">6</button>
  <button class="key" onclick="add('7')">7</button>
  <button class="key" onclick="add('8')">8</button>
  <button class="key" onclick="add('9')">9</button>
  <button class="key" onclick="add('*')">*</button>
  <button class="key" onclick="add('0')">0</button>
  <button class="key" onclick="add('#')">#</button>
 </div>

 <div class="actions">
  <button class="call" onclick="startCall()">📞 Call</button>
  <button class="end" onclick="endCall()">✖ End</button>
 </div>

 <div class="status" id="status">Ready to dial</div>

 <div class="footer">
  GlobalCall • International Calling Demo
 </div>
</div>

<script>
const phone=document.getElementById('phone');
const statusBox=document.getElementById('status');

function add(n){
 phone.value+=n;
}

function startCall(){
 const n=phone.value.trim();
 if(!n){
  statusBox.textContent="Enter a phone number first";
  return;
 }
 statusBox.textContent="Call demo: "+n;
 alert("Demo dialer only. VoIP provider connection is required to make real calls.");
}

function endCall(){
 statusBox.textContent="Call ended";
}

function recharge(){
 alert("Recharge/payment system is not connected yet.");
}
</script>
</body>
</html>
