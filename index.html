<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GlobalCall</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #101827;
  color: white;
  text-align: center;
  padding: 20px;
}
.container {
  max-width: 400px;
  margin: 40px auto;
  background: #1e293b;
  padding: 25px;
  border-radius: 20px;
}
h1 { color: #38bdf8; }
input {
  width: 90%;
  padding: 15px;
  margin: 10px 0;
  border-radius: 10px;
  border: none;
  font-size: 18px;
}
button {
  width: 100%;
  padding: 15px;
  margin-top: 12px;
  border: none;
  border-radius: 12px;
  background: #22c55e;
  color: white;
  font-size: 18px;
}
.balance {
  background: #334155;
  padding: 15px;
  border-radius: 10px;
  margin: 20px 0;
}
#status {
  margin-top: 15px;
  overflow-wrap: anywhere;
}
</style>
</head>
<body>
<div class="container">
<h1>🌍 GlobalCall</h1>
<p>International Calling Service</p>

<div class="balance">Balance: $0.00</div>

<input type="tel" id="phone" placeholder="Enter country code + number">

<button onclick="startCall()">📞 Call Now</button>

<button onclick="alert('Recharge coming soon!')">
💳 Recharge Balance
</button>

<p id="status"></p>

<p style="margin-top:30px;color:#94a3b8;">
Secure International Calling
</p>
</div>

<script>
async function startCall() {
  const number = document.getElementById("phone").value.trim();
  const status = document.getElementById("status");

  if (!number) {
    status.textContent = "Enter a phone number first.";
    return;
  }

  const pin = prompt("Enter your calling PIN:");
  if (!pin) return;

  status.textContent = "Connecting call...";

  try {
    const response = await fetch("/api/call", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        number: number,
        pin: pin
      })
    });

    const data = await response.json();

    if (data.success) {
      status.textContent = "Call request sent successfully!";
    } else {
      status.textContent = data.error || "Call failed.";
    }
  } catch (error) {
    status.textContent = "Connection error. Please try again.";
  }
}
</script>
</body>
</html>
