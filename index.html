<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GlobalCall</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #101827;
  color: white;
  text-align: center;
  padding: 20px;
}
.container {
  max-width: 400px;
  margin: 40px auto;
  background: #1e293b;
  padding: 25px;
  border-radius: 20px;
}
h1 { color: #38bdf8; }
input {
  width: 90%;
  padding: 15px;
  margin: 10px 0;
  border-radius: 10px;
  border: none;
  font-size: 18px;
}
button {
  width: 100%;
  padding: 15px;
  margin-top: 12px;
  border: none;
  border-radius: 12px;
  background: #22c55e;
  color: white;
  font-size: 18px;
}
.balance {
  background: #334155;
  padding: 15px;
  border-radius: 10px;
  margin: 20px 0;
}
</style>
</head>
<body>

<div class="container">
<h1>🌍 GlobalCall</h1>
<p>International Calling Service</p>

<div class="balance">
Balance: $0.00
</div>

<input type="tel" placeholder="Enter country code + number">

<button onclick="alert('Calling service will be connected after backend setup!')">
📞 Call Now
</button>

<button onclick="alert('Recharge system coming soon!')">
💳 Recharge Balance
</button>

<p style="margin-top:30px;color:#94a3b8;">
Secure International Calling
</p>
</div>

</body>
</html>
